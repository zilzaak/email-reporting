<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shopping Input</title>
    <style>
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 15px;
            color: white;
            font-weight: bold;
            text-align: center;
        }

        .loader-container {
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        /* Voice input styling - ADD THIS */
        .voice-active {
            background-color: #e8f0fe !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2) !important;
        }

        .input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .voice-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            border-radius: 50%;
            transition: all 0.2s;
            z-index: 10;
        }

        .voice-btn:hover {
            background-color: #e5e7eb;
            transform: translateY(-50%) scale(1.1);
        }

        .voice-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1f2937;
            color: white;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 14px;
            z-index: 10000;
            display: none;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .voice-status.active {
            display: flex;
            background: #3b82f6;
        }

        .voice-status.error {
            background: #ef4444;
        }

        .voice-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .input-wrapper:hover {
            cursor: pointer;
        }

        input:hover {
            background-color: #fef3c7 !important;
            transition: all 0.2s ease;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
<!--    <link rel="stylesheet" th:href="@{/tailwind.css}">-->
<!--    <link rel="stylesheet" th:href="@{/webjars/tailwindcss/tailwind.min.css}">-->
    <script type="text/javascript">
        function setDate(){
            var x = document.getElementById("date").value;
            if(x.toString().length=10){
                document.getElementById("search").click();
            }
        }

        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent any default form submission
                document.querySelector('button[value="save"]').click();
            }
        });


        function calcInput(param) {
            var opstr=document.getElementById("calcDisplay").value;
            var result=document.getElementById("resultDisplay").value;

            if(opstr===undefined){
                document.getElementById("calcDisplay").value="";
                opstr="";
            }
            if(result===undefined){
                document.getElementById("resultDisplay").value="";
                result="";
            }

            if(opstr.toString()===""){
                if(param.toString()==="/" || param.toString()==="+" || param.toString()==="-" || param.toString()==="*"){
                        return;
                    }else{
                    document.getElementById('calcDisplay').value=param.toString();
                      }
            }else{
                if(param.toString()==="/" || param.toString()==="+" || param.toString()==="-" || param.toString()==="*"){
                    if(opstr.toString().slice(-1)==="+" || opstr.toString().slice(-1)==="-" ||
                        opstr.toString().slice(-1)==="/" || opstr.toString().slice(-1)==="*"){
                        return;
                    }else{
                        document.getElementById('calcDisplay').value=opstr+ param.toString();
                    }
                }
                else{
                    if(opstr.toString().slice(-1)==="+" || opstr.toString().slice(-1)==="-" ||
                        opstr.toString().slice(-1)==="/" || opstr.toString().slice(-1)==="*"){

                        var lastChar=opstr.toString().slice(-1);
                        var numb = opstr.slice(0, -1);
                        if(result===""){
                            if(lastChar==="+"){
                                result=Number(numb.toString())+Number(param.toString());
                            }
                            if(lastChar==="-"){
                                result=Number(numb.toString())-Number(param.toString());
                            }
                            if(lastChar==="*"){
                                result=Number(numb.toString())*Number(param.toString());
                            }
                            if(lastChar==="/"){
                                result=Number(numb.toString())/Number(param.toString());
                            }
                            document.getElementById('calcDisplay').value=opstr+param.toString();
                            document.getElementById("resultDisplay").value=result;
                        }else{
                            if(lastChar==="+"){
                                result=Number(result.toString())+Number(param.toString());
                            }
                            if(lastChar==="-"){
                                result=Number(result.toString())-Number(param.toString());
                            }
                            if(lastChar==="*"){
                                result=Number(result.toString())*Number(param.toString());
                            }
                            if(lastChar==="/"){
                                result=Number(result.toString())/Number(param.toString());
                            }
                            document.getElementById('calcDisplay').value=opstr+param.toString();
                            document.getElementById("resultDisplay").value=result;

                        }

                    }else{
                        if(result===""){
                            opstr=opstr.toString()+param.toString();
                            document.getElementById("calcDisplay").value=opstr;
                        }else{
                            var numbers = opstr.toString().match(/\d+/g);  // Matches all number sequences
                            var lastNumber = numbers[numbers.length - 1];
                            var operators = opstr.toString().match(/[+\-*/]/g);  // Match all operators
                            var lastOperator = operators[operators.length - 1];
                            opstr=opstr.toString()+param.toString();
                            var updatedLastNumber=Number(lastNumber.toString()+param.toString());


                            if(lastOperator.toString()==='+'){
                                result=Number(result.toString())-Number(lastNumber.toString());
                                result=Number(result.toString())+updatedLastNumber;

                            }
                            if(lastOperator.toString()==='-'){
                                result=Number(result.toString())+Number(lastNumber.toString());
                                result=Number(result.toString())-updatedLastNumber;
                            }
                            if(lastOperator.toString()==='*'){
                                result=Number(result.toString())/Number(lastNumber.toString());
                                result=Number(result.toString())*updatedLastNumber;
                            }
                            if(lastOperator.toString()==='/'){
                                result=Number(result.toString())*Number(lastNumber.toString());
                                result=Number(result.toString())/updatedLastNumber;
                            }
                            document.getElementById("resultDisplay").value=result;
                            document.getElementById("calcDisplay").value=opstr;
                        }


                    }

                }
            }

        }


        function calcClear() {
            document.getElementById("calcDisplay").value="";
            document.getElementById("resultDisplay").value="";
        }

        function calcEquals(){
            var result = document.getElementById("resultDisplay").value;
            document.getElementById("calcDisplay").value=result.toString();
            document.getElementById("resultDisplay").value="";
        }

        function showLoader() {
            document.getElementById('loaderOverlay').style.display = 'flex';
        }

        // Show loader when any submit button is clicked
        // REPLACE your existing DOMContentLoaded with this
        document.addEventListener('DOMContentLoaded', function() {
            var buttons = document.querySelectorAll('button[type="submit"]');
            buttons.forEach(function(button) {
                button.addEventListener('click', function() {
                    showLoader();
                });
            });

            initVoiceInput(); // ADD THIS LINE - Initialize voice input
        });

        // ============================================
        // ENHANCED VOICE INPUT - Multi-item Support
        // ============================================

        let currentActiveInput = null;
        let isListening = false;
        let recognition = null;
        let pauseTimeout = null;
        const PAUSE_DURATION = 800;
        const COMMA_TRIGGERS = ['and', 'comma', 'then', 'also', 'plus'];

        function initVoiceInput() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showVoiceStatus('Voice input not supported', 'error');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            setupVoiceForInputs();
            recognition.onresult = function(event) {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    }
                }
                if (finalTranscript && currentActiveInput) {
                    processVoiceInput(finalTranscript);
                }
            };
            recognition.onerror = function(event) {
                showVoiceStatus('Error: ' + event.error, 'error');
                stopListening();
            };
            recognition.onend = function() {
                if (isListening) {
                    try { recognition.start(); } catch(e) { stopListening(); }
                }
            };
        }

        function processVoiceInput(transcript) {
            if (!currentActiveInput) return;

            // For NUMBER fields (item price) - RAW input, NO commas, NO pause logic
            if (currentActiveInput.type === 'number') {
                // Just extract numbers directly from speech
                let numbers = transcript.match(/\d+(?:\.\d+)?/g);
                if (numbers) {
                    currentActiveInput.value = numbers[0];
                    showVoiceStatus('✓ Price: ' + numbers[0], 'success');
                }
                currentActiveInput.dispatchEvent(new Event('input', { bubbles: true }));
                return;
            }

            // For TEXT fields (item name) - multi-item logic with commas and "and"
            let words = transcript.toLowerCase().split(/\s+/);
            let items = [];
            let currentItem = '';

            for (let i = 0; i < words.length; i++) {
                let word = words[i];
                if (COMMA_TRIGGERS.includes(word)) {
                    if (currentItem.trim()) items.push(currentItem.trim());
                    currentItem = '';
                } else {
                    currentItem += (currentItem ? ' ' : '') + word;
                }
            }
            if (currentItem.trim()) items.push(currentItem.trim());

            if (items.length === 0) return;

            let existing = currentActiveInput.value;
            currentActiveInput.value = existing ? existing + ', ' + items.join(', ') : items.join(', ');
            showVoiceStatus('✓ Added: ' + items.join(', '), 'success');

            currentActiveInput.dispatchEvent(new Event('input', { bubbles: true }));
            resetPauseTimer();
        }

        function resetPauseTimer() {
            if (pauseTimeout) clearTimeout(pauseTimeout);
            pauseTimeout = setTimeout(() => {
                // ONLY add comma for TEXT fields - SKIP number fields completely
                if (isListening && currentActiveInput && currentActiveInput.type !== 'number') {
                    if (currentActiveInput.value && !currentActiveInput.value.endsWith(', ')) {
                        currentActiveInput.value += ', ';
                        currentActiveInput.dispatchEvent(new Event('input', { bubbles: true }));
                    }
                }
            }, PAUSE_DURATION);
        }

        function setupVoiceForInputs() {
            document.querySelectorAll('input[type="text"], input[type="number"]').forEach(input => {
                if (input.id === 'calcDisplay' || input.id === 'resultDisplay' || input.parentElement.classList.contains('input-wrapper')) return;

                const wrapper = document.createElement('div');
                wrapper.className = 'input-wrapper';
                input.parentNode.insertBefore(wrapper, input);
                wrapper.appendChild(input);

                const voiceBtn = document.createElement('button');
                voiceBtn.innerHTML = '🎤';
                voiceBtn.className = 'voice-btn';
                voiceBtn.type = 'button';
                wrapper.appendChild(voiceBtn);

                voiceBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    startVoiceForInput(input);
                });

                // SIMPLE: Track mouse enter - when mouse goes over field
                input.addEventListener('mouseenter', () => {
                    // Switch voice input to this field immediately
                    if (currentActiveInput !== input) {
                        // Remove highlight from old field
                        if (currentActiveInput) {
                            currentActiveInput.classList.remove('voice-active');
                        }
                        // Set new field
                        currentActiveInput = input;
                        currentActiveInput.classList.add('voice-active');
                        showVoiceStatus('🎤 Now speaking to: ' + (input.type === 'number' ? 'Price' : 'Item Name'), 'listening');
                    }
                });

                // Keep focus event as backup
                input.addEventListener('focus', () => {
                    if (currentActiveInput !== input) {
                        if (currentActiveInput) {
                            currentActiveInput.classList.remove('voice-active');
                        }
                        currentActiveInput = input;
                        currentActiveInput.classList.add('voice-active');
                    }
                });
            });
        }

        function startVoiceForInput(input) {
            if (!recognition) return;

            // Stop any ongoing recognition first
            if (isListening) {
                recognition.stop();
                // Wait for stop to complete then start new
                setTimeout(() => {
                    startNewSession(input);
                }, 200);
            } else {
                startNewSession(input);
            }
        }

        function startNewSession(input) {
            // IMPORTANT: Clear previous input highlight FIRST
            if (currentActiveInput && currentActiveInput !== input) {
                currentActiveInput.classList.remove('voice-active');
            }

            // Set new current input
            currentActiveInput = input;
            currentActiveInput.classList.add('voice-active');
            isListening = true;

            try {
                recognition.start();
                showVoiceStatus('🎤 Listening...', 'listening');
                resetPauseTimer();
            } catch(e) {
                showVoiceStatus('Allow microphone access', 'error');
                stopListening();
            }
        }

        function stopListening() {
            isListening = false;
            if (pauseTimeout) clearTimeout(pauseTimeout);
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            if (currentActiveInput) {
                currentActiveInput.classList.remove('voice-active');
            }
            setTimeout(() => {
                let s = document.getElementById('voiceStatus');
                if (s && !isListening) {
                    s.classList.remove('active', 'error');
                    s.style.display = 'none';
                }
            }, 2000);
        }

        function showVoiceStatus(message, type) {
            let s = document.getElementById('voiceStatus');
            if (!s) { s = document.createElement('div'); s.id = 'voiceStatus'; s.className = 'voice-status'; document.body.appendChild(s); }
            s.innerHTML = (type === 'listening' ? '<div class="voice-dot"></div>' : (type === 'success' ? '✓ ' : '⚠️ ')) + message;
            s.classList.remove('error');
            s.classList.add(type === 'error' ? 'error' : 'active');
            s.style.display = 'flex';
            if (type === 'success') setTimeout(() => { if (s.style.display === 'flex') s.style.display = 'none'; }, 3000);
        }


    </script>


</head>

        <div class="p-4">
            <!-- Header with close -->

                <span class="font-medium">Calculator</span>
                <button onclick="document.getElementById('calcModal').close()" class="text-xl">&times;</button>

            <!-- Display -->

            <!-- Display -->

            <!-- Buttons grid -->
            <div class="grid grid-cols-4 gap-2">
                <!-- Row 1 -->
                <button onclick="calcInput('7')" class="p-2 border rounded hover:bg-gray-100">7</button>
                <button onclick="calcInput('8')" class="p-2 border rounded hover:bg-gray-100">8</button>
                <button onclick="calcInput('9')" class="p-2 border rounded hover:bg-gray-100">9</button>
                <button onclick="calcInput('/')" class="p-2 border rounded bg-gray-200">/</button>

                <!-- Row 2 -->
